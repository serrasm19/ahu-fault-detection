name: CI

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: submission/code

jobs:
  branch-policy:
    name: branch-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check that the PR follows feature/* -> develop -> qa -> main
        working-directory: .
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE" in
            develop) [[ "$HEAD" == feature/* ]] ;;
            qa)      [[ "$HEAD" == develop ]] ;;
            main)    [[ "$HEAD" == qa ]] ;;
            *)       false ;;
          esac || { echo "PRs into '$BASE' cannot come from '$HEAD'."; exit 1; }
          echo "OK: $HEAD -> $BASE"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff (same version as requirements.txt)
        run: pip install "$(grep '^ruff==' requirements.txt)"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: submission/code/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests with coverage (minimum in pyproject.toml)
        run: pytest -q --cov --cov-report=term-missing
