[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahu-fdd"
version = "1.0.0"
description = "Fault detection and diagnosis for air handling units"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["ahu_fdd"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Moderate set: real errors (F), pycodestyle (E, W), import order (I),
# likely bugs (B) and modern syntax (UP)
select = ["E", "W", "F", "I", "B", "UP"]
